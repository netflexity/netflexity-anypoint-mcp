server:
  port: ${PORT:8080}

spring:
  application:
    name: anypoint-mcp
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s
  ai:
    mcp:
      server:
        name: anypoint-mcp
        version: 1.0.0

admin:
  key: ${ADMIN_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflexity.anypoint: INFO
    org.springframework.ai: INFO

license:
  keys:
    # Test keys for dev/testing — real keys set via LICENSE_KEYS_* env vars in Railway
    "test-pro-key-123": "PRO"
    "test-ent-key-456": "ENTERPRISE"
