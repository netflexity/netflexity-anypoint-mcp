server:
  port: ${PORT:8080}

spring:
  main:
    web-application-type: reactive
  application:
    name: anypoint-mcp
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s
  ai:
    mcp:
      server:
        name: anypoint-mcp
        version: 1.0.0
        instructions: >-
          Netflexity Anypoint MQ MCP. Operate Anypoint MQ from your AI assistant:
          list destinations, inspect queue depth and stats, browse and redrive
          dead-letter queues, send/consume messages, and analyze MQ cost. Includes
          supporting Anypoint reads (application status, logs, and monitoring) used
          for MQ incident triage and health scoring. Focus is Anypoint MQ today;
          more Anypoint domains may be added over time.
        transport: SSE
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        request-timeout: 300s

admin:
  key: ${ADMIN_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflexity.anypoint: INFO
    org.springframework.ai: INFO
    anypoint.api: INFO

license:
  keys:
    # Test keys for dev/testing — real keys set via LICENSE_KEYS_* env vars in Railway
    "test-pro-key-123": "PRO"
    "test-ent-key-456": "ENTERPRISE"
